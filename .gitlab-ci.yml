image: registry.gitlab.com/chromaway/core-tools/chromia-images/maven-docker:1.1.2
include:
  - project: "chromaway/core-infra/gitlab-automation"
    ref: 1.1.0
    file: templates/release.yml

stages:
  - build
  - deploy
  - release

deploy:
  stage: deploy
  only:
    - dev
    - main
    - /^support\/.*$/
  script:
    - mvn $MAVEN_CLI_OPTS deploy -Pgitlab-registry -Drevision=0-SNAPSHOT

build:
  stage: build
  except:
    - dev
    - main
    - tags
    - /^support\/.*$/
  script:
    - mvn $MAVEN_CLI_OPTS verify

deploy-release:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mvn $MAVEN_CLI_OPTS deploy -Drevision=$CI_COMMIT_TAG

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -s .gitlab-settings.xml -DtrimStackTrace=false -U -Dsurefire.skipAfterFailureCount=1"
  # Configure postgres service (https://hub.docker.com/_/postgres/)
  POSTGRES_DB: postchain
  POSTGRES_USER: postchain
  POSTGRES_PASSWORD: postchain
  POSTCHAIN_DB_URL: jdbc:postgresql://postgres/postchain
  CHR_DB_URL: postgres
  # Instruct Testcontainers to use the daemon of DinD.
  DOCKER_HOST: tcp://docker:2375
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

services:
  - postgres
  - name: docker:20-dind
    alias: docker
    # explicitly disable tls to avoid docker startup interruption
    command: [ "--tls=false" , "--experimental"]

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  paths:
    - .m2/repository
