image: registry.gitlab.com/chromaway/core-tools/chromia-images/maven-docker-java21:1.0.1
include:
  - project: "chromaway/core-infra/gitlab-automation"
    ref: 1.2.0
    file:
      - templates/release.yml
      - templates/maven-dependency-scanning.yml
      - templates/report-code-coverage.yml

.setup:
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
        - "*/target/failsafe-reports/TEST-*.xml"
    expire_in: 1 week
  before_script:
    - git config --global url."https://".insteadOf ssh://

stages:
  - build
  - code-coverage
  - deploy
  - dependency-check
  - prepare_release
  - release

# Triggered by that something was merged into or pushed onto main
deploy-snapshot:
  extends: .setup
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - CURRENT_VERSION=$(git describe --tags --abbrev=0)
    - IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
    - SNAPSHOT_VERSION=$MAJOR.$((MINOR + 1)).0-SNAPSHOT
    - mvn
      $MAVEN_CLI_OPTS
      --activate-profiles ci
      -Drevision=$SNAPSHOT_VERSION
      clean source:jar deploy

# Triggered by that a semver tag was pushed
deploy:
  extends: .setup
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - mvn
      $MAVEN_CLI_OPTS
      --activate-profiles ci
      -Drevision=$CI_COMMIT_TAG
      clean source:jar deploy

build:
  extends:
    - .setup
    - .visualise-test-coverage
  stage: build
  except:
    - dev
    - main
    - tags
    - /^support\/.*$/
  script:
    - mvn $MAVEN_CLI_OPTS verify --activate-profiles ci,coverage
  artifacts:
    when: always
    paths:
      - $JACOCO_REPORT_DIR/*
      - postchain-eif-core/logs/

prepare_release:
  image: registry.gitlab.com/chromaway/core-tools/chromia-images/maven-docker:1.1.4
  stage: prepare_release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes > release_notes.md'
  artifacts:
    paths:
      - release_notes.md

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: prepare_release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - echo "Postchain EIF $CI_COMMIT_TAG"
  release:
    name: 'Release EIF $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'

dependency-check:
  extends:
    - .setup
    - .maven-dependency-check
  stage: dependency-check
  interruptible: true
  rules:
    - if: $RUN_DEPENDENCY_CHECK == "true"

test-coverage-report:
  stage: code-coverage
  except:
    - dev
    - main
    - tags
    - /^support\/.*$/
  dependencies:
    - build

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -s .gitlab-settings.xml -DtrimStackTrace=false -U -Dsurefire.skipAfterFailureCount=1"
  MAVEN_CLI_NVD_OPTS: "-DnvdDatafeedUrl=https://nvd-data-feeds.chromia.dev/nvdcve-{0}.json.gz"
  # Configure postgres service (https://hub.docker.com/_/postgres/)
  POSTGRES_DB: postchain
  POSTGRES_USER: postchain
  POSTGRES_PASSWORD: postchain
  POSTGRES_INITDB_ARGS: "--lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8"
  POSTCHAIN_DB_URL: jdbc:postgresql://postgres/postchain
  CHR_DB_URL: jdbc:postgresql://postgres/postchain
  ORIGINALS_REPO: https://x-token-auth:$ORIGINALS_ACCESS_TOKEN@bitbucket.org/chromawallet/originals-dip.git
  # Instruct Testcontainers to use the daemon of DinD.
  DOCKER_HOST: tcp://docker:2375
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2
  JACOCO_REPORT_DIR: postchain-eif-core/target/site/jacoco

services:
  - postgres
  - name: docker:20-dind
    alias: docker
    # explicitly disable tls to avoid docker startup interruption
    command: [ "--tls=false" , "--experimental"]

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  paths:
    - .m2/repository
