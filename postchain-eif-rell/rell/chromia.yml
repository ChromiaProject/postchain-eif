definitions:
  - &eif_test
    chains:
      goerli:
        network_id: 5
        contracts:
          - '0xb7eb5d60dd5610a82a4844beb3f7d750316d3d32'
        skip_to_height: 9149852
        events: !include configs/events.yml
  - &common_args
    lib.ft4.accounts:
      rate_limit:
        active: true
        max_points: 200
        recovery_time: 5000
        points_at_account_creation: 100
  - &rell_test_args
    lib.ft4.admin:
      admin_pubkey: 0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57
    lib.access.admin:
      admin_pubkey: 0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57

test:
  modules:
    - tests.utils
    - tests.ft4
    - transaction_submitter.test
  moduleArgs:
    <<: *common_args
    <<: *rell_test_args
    transaction_submitter:
      contract_whitelist: "address,address1"
      contract_tx_rate_limit: 60000
      tx_timeout: 86400000 #24h
      node_retry_strategy: SUPERMAJORITY

blockchains:
  eif:
    module: main
    config:
      gtx:
        modules: ['net.postchain.eif.EifGTXModule']
      eif:
        <<: *eif_test
      sync_ext: ['net.postchain.eif.EifSynchronizationInfrastructureExtension']
    moduleArgs:
      <<: *common_args
      <<: *rell_test_args
  transaction_submitter:
    module: transaction_submitter
    moduleArgs:
      transaction_submitter:
        # TODO add addresses
        contract_whitelist: "" # Comma separated list since Rell does not support list type as module arg
        contract_tx_rate_limit: 60000
        tx_timeout: 86400000 #24h
        node_retry_strategy: SUPERMAJORITY
    config:
      gtx:
        modules:
          - "net.postchain.eif.transaction.TransactionSubmitterGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      transaction_submitter:
        chains:
          goerli: 5
        node_tx_timeout: 86400000 #24h
      sync_ext:
        - "net.postchain.eif.transaction.TransactionSubmitterSynchronizationInfrastructureExtension"
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      icmf:
        receiver:
          global:
            topics:
              - G_evm_submit_transaction


compile:
  source: src
  target: target
  rellVersion: 0.13.5
libs:
 ft4:
   registry: https://bitbucket.org/chromawallet/ft3-lib
   path: rell/src/lib/ft4
   tagOrBranch: v0.4.0r
   rid: x"090F6B6ED8BFEB73CF67D8D671F3B72E8232C5E540449EB0A609A01F6901CE80"
   insecure: false
 iccf:
   registry: https://gitlab.com/chromaway/core/directory-chain
   path: src/iccf
   tagOrBranch: 1.32.2
   rid: x"1D567580C717B91D2F188A4D786DB1D41501086B155A68303661D25364314A4D"
   insecure: false
