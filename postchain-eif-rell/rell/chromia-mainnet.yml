definitions:
  - &chain_version
    release_version: ${RELEASE_VERSION:-dev}
    release_commit: ${RELEASE_COMMIT:-dev}

blockchains:
  eif_event_receiver_mainnet:
    module: eif_event_receiver_chain_common
    config:
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      eif:
        chains:
          bsc:
            network_id: 56
            evm_read_offset: 100
            contracts:
              - '0xc5B2d0F1F659A72c3c94E6E654C859771161eFD3' # bridge
              - '0x6414FbBf1CC9d9253125e106435619577bAAc2aC' # staking
            skip_to_height: 7743093
            events: !include configs/events.yml
          ethereum:
            network_id: 1
            evm_read_offset: 50
            contracts:
              - '0xb1632e7de8B3d18277Cc3C99B6819795bBDe8654' # bridge
              - '0xC7b0F970c1EFBB181194Fc15ccD5C4a2c2Ab863B' # staking
            skip_to_height: 11223368
            events: !include configs/events.yml
    moduleArgs:
      chain_version: *chain_version

  eif_event_receiver_token_chain_mainnet:
    module: eif_event_receiver_dynamic_icmf_config_chain_common
    config:
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      eif:
        chains:
          bsc:
            network_id: 56
            evm_read_offset: 10
            skip_to_height: 7743093
            events: !include configs/events.yml
          ethereum:
            network_id: 1
            evm_read_offset: 50
            skip_to_height: 11223368
            events: !include configs/events.yml
      icmf:
        receiver:
          local:
            - bc-rid: x"" # Replace with token chain
              topic: "L_eif_event_receiver_dynamic_config"
            - bc-rid: x"" # Replace with token chain
              topic: "L_eif_event_receiver_dynamic_config_v2"
    moduleArgs:
      chain_version: *chain_version
      eif_event_receiver_dynamic_icmf_config:
        configuration_chain: "token_chain"

  eif_event_receiver_price_oracle_mainnet:
    module: eif_event_receiver_chain_common
    config:
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      eif:
        chains:
          bsc:
            network_id: 56
            evm_read_offset: 100
            contracts:
              - '0x6045931E511EF7e53A4A817F971e0CA28c758809'
              - '0x16b9a82891338f9ba80e2d6970fdda79d1eb0dae'
            skip_to_height: 40347862
            events: !include configs/events_price_oracle.yml
          ethereum:
            network_id: 1
            evm_read_offset: 50
            contracts:
              - '0xd366Ed22F5b2262A2Da4C32D8A4607C93690134a'
              - '0xB4e16d0168e52d35CaCD2c6185b44281Ec28C9Dc'
            skip_to_height: 20275380
            events: !include configs/events_price_oracle.yml

  transaction_submitter:
    module: transaction_submitter
    moduleArgs:
      transaction_submitter:
        # List of public keys that are allowed to reset failed signer list updates
        manual_admins:
          - 0319852651DB3ACA5D5DFDF71D8600566345FE1713BCBC7F2C1B6434B7A8C88C6F # Chromaway provider
        directory_chain_config:
          blockchain_rid: x"7E5BE539EF62E48DDA7035867E67734A70833A69D2F162C457282C319AA58AE4"
          validator_contracts:
            - address: "c755927508b7Ac3f7B31c9Ed396F3bE91C723d00"
              network_id: 1
            - address: "c755927508b7Ac3f7B31c9Ed396F3bE91C723d00"
              network_id: 56
        # Omit this to disable anchoring
        system_anchoring_chain_config:
          blockchain_rid: x"B497391373BB74944193205EB37C84B0520D474F491E2EF4743F16F670DB289B"
          anchoring_contracts:
            - address: "EB6915F71BB18BcD8a6763187Fcb004Ff91e8695"
              validator_contract: "988414f24040429E0c0A595fc62cE5EABCdF767F"
              network_id: 1
        # economy-chain
        system_chain_bridges:
          - blockchain_rid: x"15C0CA99BEE60A3B23829968771C50E491BD00D2E3AE448580CD48A8D71E7BBA"
            bridge_contracts:
              - address: "b1632e7de8B3d18277Cc3C99B6819795bBDe8654"
                validator_contract: "58D384e2B43779B85C70b4C15A36b7051384149E"
                network_id: 1
              - address: "c5B2d0F1F659A72c3c94E6E654C859771161eFD3"
                validator_contract: "5843EEBE89e91866ADC18df07eB5C943DA581585"
                network_id: 56
        #          - blockchain_rid: x"" # TODO replace with token-chain rid
        #            bridge_contracts:
        #              - address: "" # There is no single bridge address for token chain
        #                validator_contract: "" # TODO: Replace with token chain validator
        #                network_id: 1
        #              - address: "" # There is no single bridge address for token chain
        #                validator_contract: "" # TODO: Replace with token chain validator
        #                network_id: 56
        contract_tx_rate_limit: 60000
        tx_node_submit_timeout: 1800000 # 30m
        tx_verification_timeout: 5400000 # 90 min - from the time a TX was TAKEN
        tx_timeout: 14400000 # 4h
        node_retry_strategy: SUPERMAJORITY
        network_configs:
          - id: 56
            currency_symbol: "BNB"
          - id: 1
            currency_symbol: "ETH"
        system_max_priority_fee_per_gas: 25000000000
        system_max_fee_per_gas: 180000000000
      transaction_submitter.anchoring:
        anchoring_interval: 7200000 # every 2 hours
      chain_version: *chain_version
    config:
      gtx:
        modules:
          - "net.postchain.eif.transaction.TransactionSubmitterGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      transaction_submitter:
        chains:
          bsc:
            network_id: 56
            max_gas_price: 10000000000000000 # Total gas cost per transaction
            min_wallet_balance: 10000000000000000
            gas_limit: 10000000 # 300 000 was too low
            gas_limit_margin: "0.2" # 20%
            base_fee_per_gas_margin: "0.85" # +85% (base_fee + base_fee * 0.85)
            priority_fee_per_gas_margin: "0.000001" # 0.00001% # Small margin to pass the default priority fees
            node_tx_verification_evm_blocks: 100
            tx_verification_time: 20000
          ethereum:
            network_id: 1
            max_gas_price: 20000000000000000 # Total gas cost per transaction, 2024-10-11: 0.02 ETH / 53 USD
            min_wallet_balance: 10000000000000000
            gas_limit: 10000000 # 300 000 was too low
            gas_limit_margin: "0.2" # 20%
            base_fee_per_gas_margin: "0.85" # +85% (base_fee + base_fee * 0.85)
            priority_fee_per_gas_margin: "0.000001" # 0.00001% # Small margin to pass the default priority fees
            node_tx_verification_evm_blocks: 50
            tx_verification_time: 20000
      sync_ext:
        - "net.postchain.eif.transaction.TransactionSubmitterSynchronizationInfrastructureExtension"
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      icmf:
        receiver:
          directory-chain:
            topics:
              - L_signer_list_update
          local:
            - bc-rid: x"15C0CA99BEE60A3B23829968771C50E491BD00D2E3AE448580CD48A8D71E7BBA" # economy-chain
              topic: "L__bridge_mapping"
          global:
            topics:
              - G_evm_submit_transaction


compile:
  source: src
  target: target
  rellVersion: 0.13.13
