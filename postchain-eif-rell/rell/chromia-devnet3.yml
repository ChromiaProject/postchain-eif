blockchains:
  eif_event_receiver_devnet3:
    module: eif_event_receiver
    config:
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      eif:
        chains:
          bsc:
            network_id: 97
            contracts:
              - "0x493D0ECf721c375E7Da44a79eA172ba4EdbA3728"
              - "0x753218363422002DF74F3D0D8d67f6CB38bE32D0"
            skip_to_height: 5801241
            events: !include configs/events.yml
          sepolia: # not used in devnet3
            network_id: 11155111
            contracts:
              - "0xc50D39756779abFF28C45264D74f0352065CD248"
            skip_to_height: 5801241
            events: !include configs/events.yml
  transaction_submitter_devnet3:
    module: transaction_submitter
    moduleArgs:
      transaction_submitter:
        # List of public keys that are allowed to reset failed signer list updates
        manual_admins:
          - 03ECD350EEBC617CBBFBEF0A1B7AE553A748021FD65C7C50C5ABB4CA16D4EA5B05 # alpha provider
        directory_chain_config:
          blockchain_rid: x"0A20972F2DA8670B0AB9C07A4DEA7C6BBD296BB90A9E462FF74F6FB538328946"
          validator_contracts:
            - address: "03135EBc9D10235D77e2Adfc7cEd96737A9dC9c2"
              network_id: 97
        # Omit this to disable anchoring
        system_anchoring_chain_config: null
        system_chain_bridges:
          - blockchain_rid: x"BADCEEE1EF276C4384E21B190CB39F7F13064763366D13D6393B9ABED7D87F23" # economy-chain
            bridge_contracts:
              - address: "2Cf48D2891CC286d18596Df1261D011d1B78E03E"
                validator_contract: "FdB06dB69e45a732bDF0B44FA590dAcb33deE281"
                network_id: 97
        contract_tx_rate_limit: 60000
        tx_node_submit_timeout: 1800000 # 30m
        tx_timeout: 1200000 # 20m
        node_retry_strategy: SUPERMAJORITY
        network_configs:
          - id: 97
            currency_symbol: "BNB"
        system_max_priority_fee_per_gas: 25000000000
        system_max_fee_per_gas: 180000000000
    config:
      gtx:
        modules:
          - "net.postchain.eif.transaction.TransactionSubmitterGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      transaction_submitter:
        chains:
          bsc:
            network_id: 97
            max_gas_price: 30000000000000000
            min_wallet_balance: 1000000000000000
            node_tx_verification_evm_blocks: 100
            tx_verification_time: 20000
            gas_limit: 10000000
            gas_limit_margin: "0.2" # 20%
            base_fee_per_gas_margin: "1.5" # +150% (base_fee + base_fee * 1.5)
            priority_fee_per_gas_margin: "0.000001" # 0.00001% # Small margin to pass the default priority fees
        node_tx_verification_timeout: 1500000 # 25 min - a bit less than tx_node_submit_timeout
      sync_ext:
        - "net.postchain.eif.transaction.TransactionSubmitterSynchronizationInfrastructureExtension"
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      icmf:
        receiver:
          directory-chain:
            topics:
              - L_signer_list_update
          local:
            - bc-rid: x"BADCEEE1EF276C4384E21B190CB39F7F13064763366D13D6393B9ABED7D87F23" # economy-chain
              topic: "L_bridge_mapping"
          global:
            topics:
              - G_evm_submit_transaction