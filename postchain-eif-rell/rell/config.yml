definitions:
  - &eif_test
    chains:
      goerli:
        network_id: 5
        contracts:
          - '0xb7eb5d60dd5610a82a4844beb3f7d750316d3d32'
        skip_to_height: 9149852
        events: !include configs/events.yml
  - &common_args
    lib.ft4.accounts:
      rate_limit:
        active: true
        max_points: 200
        recovery_time: 5000
        points_at_account_creation: 100
      max_auth_descriptor_rules: 8
  - &rell_test_args
    lib.ft4.admin:
      admin_pubkey: 0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57
    lib.access.admin:
      admin_pubkey: 0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57
    lib.originals.marketplace:
      oracle_pubkey: 0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57
  - &eif_sender_receiver # Base configuration for a chain that will both send and receive messages
    gtx:
      modules:
        - "net.postchain.eif.EifSenderGTXModule"
        - "net.postchain.d1.icmf.IcmfSenderGTXModule"
        - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
    sync_ext:
      - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
test:
  modules:
    - tests.utils
    - tests.ft4
  moduleArgs:
    <<: *common_args
    <<: *rell_test_args

blockchains:
  eif:
    module: main
    config:
      eif:
        <<: *eif_test
      icmf:
        receiver:
          local:
            - topic: "L_EVM_BLOCK_EVENTS"
              brid: null
      <<: *eif_sender_receiver
    moduleArgs:
      <<: *common_args
      <<: *rell_test_args

compile:
  source: src
  target: target
  rellVersion: 0.13.5
libs:
  ft4:
    registry: https://bitbucket.org/chromawallet/ft3-lib
    path: rell/src/lib/ft4
    tagOrBranch: v0.2.0r
    rid: x"4B3DA349B20558F5700E28C110D43E07CCA7160C42D2B5C0A53E1554ACD0971D"
    insecure: false
  iccf:
    registry: https://gitlab.com/chromaway/core/directory-chain
    path: src/iccf
    tagOrBranch: 1.9.1
    rid: x"593D6EBA650BAC473E105C047B2C43A099164870304B3E5E324F714FF2F3F82F"
    insecure: false
  icmf:
    registry: https://gitlab.com/chromaway/core/directory-chain
    path: src/messaging/icmf
    tagOrBranch: 1.29.0
    rid: x"19D6BC28D527E6D2239843608486A84F44EDCD244E253616F13D1C65893F35F6"
    