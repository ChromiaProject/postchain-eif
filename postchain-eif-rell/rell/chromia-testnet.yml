definitions:
  - &chain_version
    release_version: ${RELEASE_VERSION:-dev}
    release_commit: ${RELEASE_COMMIT:-dev}

blockchains:
  eif_event_receiver_testnet:
    module: eif_event_receiver_chain_common
    config:
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      eif:
        chains:
          bsc:
            network_id: 97
            contracts:
              - "0xbAecE9d18eDad9389A73D52768613E3B59479a54" # TwoWeeksNotice / staking contract
              - "0x247b4200a8e8Db6878A2A5e4CDfbF84a50f5fFa8" # TransparentUpgradeableProxy / bridge contract
            evm_read_offset: 10
            skip_to_height: 5801241 # Jan-28-2021 10:06:53 PM +UTC
            events: !include configs/events.yml
          ethereum:
            network_id: 11155111
            contracts:
              - "0x85143Ed6A68bD91447e8bcA0a5eDDFb262F5Fe53" # TwoWeeksNotice / staking contract
              - "0x1641900FF4E8931eFDDb0607FEe4E3D3C980435D" # TransparentUpgradeableProxy / bridge contract
            evm_read_offset: 10
            skip_to_height: 2000000 # Oct-01-2022 05:06:12 PM +UTC
            events: !include configs/events.yml
          base_sepolia:
            network_id: 84532
            contracts:
              - "0x050c4a184c47AFAc1B606E75fF8E11AABeF9B362" # TransparentUpgradeableProxy / bridge contract
            evm_read_offset: 10
            skip_to_height: 20000000 # Jan-01-2025 09:51:28 PM +UTC
            events: !include configs/events.yml
    moduleArgs:
      chain_version: *chain_version

  eif_event_receiver_token_chain_testnet:
    module: eif_event_receiver_dynamic_icmf_config_chain_common
    config:
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      eif:
        chains:
          bsc:
            network_id: 97
            evm_read_offset: 10
            skip_to_height: 5801241 # TODO: Set to current height
            events: !include configs/events.yml
          ethereum:
            network_id: 11155111
            evm_read_offset: 10
            skip_to_height: 2000000 # TODO: Set to current height
            events: !include configs/events.yml
          base_sepolia:
            network_id: 84532
            evm_read_offset: 10
            skip_to_height: 20000000 # TODO: Set to current height
            events: !include configs/events.yml
      icmf:
        receiver:
          directory-chain:
            topics:
              - "L_blockchain_rid_topic"
    moduleArgs:
      chain_version: *chain_version
      eif_event_receiver_dynamic_icmf_config:
        configuration_chain: "token_chain"

  transaction_submitter_testnet:
    module: transaction_submitter
    moduleArgs:
      transaction_submitter:
        # List of public keys that are allowed to reset failed signer list updates
        manual_admins:
          - 02FEA5C0D8396B38C50200F2A583DCC8ED23416B9F9700A4AA435D57865939A536 # provider0
        directory_chain_config:
          blockchain_rid: x"6F1B061C633A992BF195850BF5AA1B6F887AEE01BB3F51251C230930FB792A92" # directory chain
          validator_contracts:
            - address: "83dB85F7ef4447524D3A31c0F4664a89173C68Eb" # directory validator
              network_id: 97
            - address: "2BcA7182ee241C29AaF63E6Fef7ECd25AE43A418" # directory validator
              network_id: 11155111
            - address: "719D2c560a9B665beC06ff65F15B241FC7B0Bf7e" # directory validator
              network_id: 84532
        # Omit this to disable anchoring
        system_anchoring_chain_config:
          blockchain_rid: x"AE21863A41714559DD02F0035FB198D0F7B49F4776CA0BCCD5B4AF9C17D694F3" # system anchoring
          anchoring_contracts: []
#            - address: "EB6915F71BB18BcD8a6763187Fcb004Ff91e8695" # TODO
#              validator_contract: "988414f24040429E0c0A595fc62cE5EABCdF767F" # TODO
#              network_id: 11155111
        # economy-chain
        system_chain_bridges:
          - blockchain_rid: x"090BCD47149FBB66F02489372E88A454E7A5645ADDE82125D40DF1EF0C76F874" # economy chain
            bridge_contracts:
              - address: "247b4200a8e8Db6878A2A5e4CDfbF84a50f5fFa8" # token bridge
                validator_contract: "338E16D38ac3123DAdd0E4912103fB8E5A0D42d8" # native validator
                network_id: 97
              - address: "050c4a184c47AFAc1B606E75fF8E11AABeF9B362" # token bridge
                validator_contract: "D5733007A3413a28c6793Ec50E2CD2229D1AE041" # native validator
                network_id: 84532
              # ETH Sepolia bridge is omitted here since it was created with directory chain validator as validator
        contract_tx_rate_limit: 60000
        tx_node_submit_timeout: 1800000 # 30m
        tx_verification_timeout: 5400000 # 90 min - from the time a TX was TAKEN
        tx_timeout: 14400000 # 4h
        node_retry_strategy: SUPERMAJORITY
        network_configs:
          - id: 97
            currency_symbol: "BNB"
          - id: 11155111
            currency_symbol: "ETH"
          - id: 84532
            currency_symbol: "ETH"
        system_max_priority_fee_per_gas: 25000000000
        system_max_fee_per_gas: 180000000000
      transaction_submitter.anchoring:
        anchoring_interval: 3600000 # every 1 hour
      chain_version: *chain_version
    config:
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.eif.transaction.TransactionSubmitterGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      transaction_submitter:
        chains:
          base_sepolia:
            network_id: 84532
            max_gas_price: 30000000000000000
            min_wallet_balance: 1000000000000000
            gas_limit: 10000000
            gas_limit_margin: "0.2" # 20%
            base_fee_per_gas_margin: "1.5" # +150% (base_fee + base_fee * 1.5)
            priority_fee_per_gas_margin: "0.000001" # 0.00001% # Small margin to pass the default priority fees
            node_tx_verification_evm_blocks: 100
            tx_verification_time: 20000
          bsc:
            network_id: 97
            max_gas_price: 30000000000000000
            min_wallet_balance: 1000000000000000
            gas_limit: 10000000
            gas_limit_margin: "0.2" # 20%
            base_fee_per_gas_margin: "1.5" # +150% (base_fee + base_fee * 1.5)
            priority_fee_per_gas_margin: "0.000001" # 0.00001% # Small margin to pass the default priority fees
            node_tx_verification_evm_blocks: 100
            tx_verification_time: 20000
          # ethereum:
          #   network_id: 11155111
          #   max_gas_price: 30000000000000000
          #   min_wallet_balance: 1000000000000000
          #   gas_limit: 10000000
          #   gas_limit_margin: "0.2" # 20%
          #   base_fee_per_gas_margin: "1.5" # +150% (base_fee + base_fee * 1.5)
          #   priority_fee_per_gas_margin: "0.000001" # 0.00001% # Small margin to pass the default priority fees
          #   node_tx_verification_evm_blocks: 50
          #   tx_verification_time: 20000
      sync_ext:
        - "net.postchain.eif.transaction.TransactionSubmitterSynchronizationInfrastructureExtension"
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      icmf:
        receiver:
          directory-chain:
            topics:
              - L_signer_list_update
          local:
            - bc-rid: x"090BCD47149FBB66F02489372E88A454E7A5645ADDE82125D40DF1EF0C76F874" # economy chain
              topic: "L__bridge_mapping"
          global:
            topics:
              - G_evm_submit_transaction


compile:
  source: src
  target: target
  rellVersion: 0.13.12
